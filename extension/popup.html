<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<style>
  :root { color-scheme: dark; }
  body { width: 292px; margin: 0; font: 13px/1.5 system-ui, sans-serif; background: #14141a; color: #e8e8ee; }
  header { display: flex; align-items: center; gap: 8px; padding: 11px 14px 9px; border-bottom: 1px solid #26262f; }
  header b { font-size: 13.5px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #555; flex: none; }
  .dot.up { background: #42e695; box-shadow: 0 0 6px rgba(66,230,149,.5); }
  .dot.busy { background: #8ec5fc; box-shadow: 0 0 6px rgba(142,197,252,.5); animation: p 1s infinite alternate; }
  .dot.down { background: #ff5f56; }
  @keyframes p { to { opacity: .3; } }
  .dim { color: #9a9aa6; font-size: 12px; }
  section { padding: 10px 14px; border-bottom: 1px solid #26262f; }
  .row { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
  .row label { flex: none; width: 66px; color: #9a9aa6; font-size: 12px; }
  .row select { flex: 1; background: #22222b; color: #e8e8ee; border: 1px solid #33333f; border-radius: 6px; padding: 4px 8px; font-size: 12.5px; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  .chip { font-size: 11px; padding: 1px 8px; border-radius: 999px; background: #22222b; border: 1px solid #33333f; color: #b8b8c4; }
  .chip.warn { border-color: #7a5c20; color: #e8c268; }
  .bar { height: 5px; border-radius: 3px; background: #26262f; margin-top: 7px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg,#42e695,#3bb2b8); transition: width .4s; }
  .switch { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .switch input { appearance: none; width: 34px; height: 19px; border-radius: 999px; background: #33333f; position: relative; cursor: pointer; margin: 0; flex: none; transition: background .2s; }
  .switch input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 15px; height: 15px; border-radius: 50%; background: #9a9aa6; transition: all .2s; }
  .switch input:checked { background: #2c7a52; }
  .switch input:checked::after { left: 17px; background: #42e695; }
  .hint { color: #77777f; font-size: 11px; margin-top: 3px; }
  footer { display: flex; gap: 8px; padding: 10px 14px 12px; }
  button { flex: 1; padding: 7px 0; border-radius: 8px; border: 1px solid #33333f; background: #22222b; color: #e8e8ee; font-size: 12.5px; cursor: pointer; }
  button:hover { border-color: #4a4a58; }
  button.primary { background: linear-gradient(135deg,#42e695,#3bb2b8); border: 0; color: #04140c; font-weight: 600; }
</style>
</head>
<body>
<header><span class="dot" id="dot"></span><b>dub 引擎</b><span class="dim" id="ping"></span></header>
<section id="jobSec">
  <div id="jobLine" class="dim">检查引擎…</div>
  <div class="bar" id="barWrap" style="display:none"><i id="fill"></i></div>
  <div class="chips" id="chips"></div>
</section>
<section>
  <div class="row"><label for="lang">默认语言</label>
    <select id="lang">
      <option value="zh">中文</option>
      <option value="en">English</option>
      <option value="ja">日本語</option>
      <option value="ko">한국어</option>
    </select>
  </div>
  <div class="switch row" style="margin-top:9px">
    <span>页面状态灯</span>
    <input type="checkbox" id="hud">
  </div>
  <div class="hint">视频页右上角的引擎进度提示；关闭后不再显示（错误仍会提示）</div>
</section>
<footer>
  <button id="open" class="primary">⚙ 管理页</button>
  <button id="refresh" style="flex:0 0 56px">↻ 刷新</button>
</footer>
<script src="popup.js"></script>
</body>
</html>
