name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # Heavy deps (torch/demucs/whisper) are lazy-imported by the engine;
      # these unit tests only need the numpy/soundfile stack.
      - run: pip install numpy soundfile pytest
      - run: python -m pytest tests/ -q

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Syntax-check extension scripts
        run: for f in extension/*.js; do node --check "$f"; done
      - name: Validate manifest.json
        run: node -e "JSON.parse(require('fs').readFileSync('extension/manifest.json','utf8')); console.log('manifest ok')"
      - name: i18n zh/en key parity
        run: node tests/check_i18n.js
